name: Get-Image-Keep-websocket-server
on: workflow_dispatch
jobs:
  download_image:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and Save Image
        run: |
          docker pull us-central1-docker.pkg.dev/keephq/keep/keep-websocket-server:latest
          docker save -o keep-websocket-server.tar us-central1-docker.pkg.dev/keephq/keep/keep-websocket-server:latest
      - name: Upload to Page
        uses: actions/upload-artifact@v4
        with:
          name: keep-websocket-server-image
          path: keep-websocket-server.tar
