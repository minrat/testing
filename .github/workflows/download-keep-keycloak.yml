name: Get-Image-keep-keycloak
on: workflow_dispatch
jobs:
  download_image:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and Save Image
        run: |
          docker pull us-central1-docker.pkg.dev/keephq/keep/keep-keycloak:0.55.0
          docker save -o keep-keycloak.tar us-central1-docker.pkg.dev/keephq/keep/keep-keycloak:0.55.0
      - name: Upload to Page
        uses: actions/upload-artifact@v4
        with:
          name: keep-keycloak-image
          path: keep-keycloak.tar
